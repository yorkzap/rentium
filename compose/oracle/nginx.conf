map $http_x_forwarded_proto $rentium_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;

  # Resolve the Django container dynamically so routine Compose recreations
  # do not leave nginx proxying to a stale container IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $django_upstream django:5000;

  client_max_body_size 100m;
  server_tokens off;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # These two prefixes are intentionally public and used by listing pages.
  location ^~ /media/properties/ {
    alias /media/properties/;
    autoindex off;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location ^~ /media/showcase/ {
    alias /media/showcase/;
    autoindex off;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # Legal documents, signatures, receipts, maintenance evidence, ledger
  # imports, and RAMA uploads are served only by authenticated Django views.
  location ^~ /media/ {
    return 404;
  }

  location / {
    proxy_pass http://$django_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $rentium_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 210s;
    proxy_send_timeout 210s;
    proxy_request_buffering off;
  }
}
