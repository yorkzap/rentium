name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

  push:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # docker-compose.local.yml declares .envs/.local/* as env_file, and
      # .gitignore excludes .envs/* — so a fresh checkout has neither, every
      # compose command below aborts before it starts, and the job has never
      # been able to pass. Throwaway values for a container that is destroyed
      # at the end of the job; nothing here is a secret and nothing here is
      # reachable from outside the runner. The entrypoint builds DATABASE_URL
      # from the POSTGRES_* vars.
      - name: Write CI env files
        run: |
          mkdir -p .envs/.local
          cat > .envs/.local/.postgres <<'EOF'
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=rentium
          POSTGRES_USER=rentium_ci
          POSTGRES_PASSWORD=rentium_ci
          EOF
          cat > .envs/.local/.django <<'EOF'
          USE_DOCKER=yes
          IPYTHONDIR=/app/.ipython
          REDIS_URL=redis://redis:6379/0
          CELERY_FLOWER_USER=ci
          CELERY_FLOWER_PASSWORD=ci
          EOF

      - name: Build the Stack
        run: docker compose -f docker-compose.local.yml build django

      - name: Build the docs
        run: docker compose -f docker-compose.docs.yml build docs

      - name: Check DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py makemigrations --check

      - name: Run DB Migrations
        run: docker compose -f docker-compose.local.yml run --rm django python manage.py migrate

      - name: Run Django Tests
        run: docker compose -f docker-compose.local.yml run django pytest

      - name: Tear down the Stack
        run: docker compose -f docker-compose.local.yml down
