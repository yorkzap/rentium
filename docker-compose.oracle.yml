name: rentium-oracle

x-django: &django
  build:
    context: .
    dockerfile: ./compose/production/django/Dockerfile
  image: rentium_oracle_django
  env_file:
    - ./.envs/.oracle/.django
    - path: ./.envs/.oracle/.providers
      required: false
    - ./.envs/.oracle/.postgres
  environment:
    DJANGO_MEDIA_STORAGE: filesystem
    DJANGO_ALLOWED_HOSTS: api.rentium.ca
    DJANGO_CSRF_TRUSTED_ORIGINS: https://rentium.ca,https://www.rentium.ca,https://*.rentium.ca
    CORS_ALLOWED_ORIGINS: https://rentium.ca,https://www.rentium.ca
    FRONTEND_URL: https://www.rentium.ca
    CANONICAL_FRONTEND_ORIGIN: https://www.rentium.ca
    PUBLIC_SITE_URL: https://www.rentium.ca
    REDIS_URL: redis://redis:6379/0
    WEB_CONCURRENCY: "2"
    DJANGO_SECURE_SSL_REDIRECT: "True"
  volumes:
    - production_media:/app/rentium/media
  init: true
  security_opt:
    - no-new-privileges:true
  logging: &default-logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: rentium_oracle_postgres
    restart: unless-stopped
    env_file:
      - ./.envs/.oracle/.postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_backups:/backups
    shm_size: 256mb
    mem_limit: 1536m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

  redis:
    image: docker.io/redis:6.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - production_redis_data:/data
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  migrate:
    <<: *django
    restart: "no"
    command: python manage.py migrate --noinput
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  django:
    <<: *django
    restart: unless-stopped
    command: /start
    mem_limit: 1536m
    pids_limit: 256
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 5000), 3).close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  celeryworker:
    <<: *django
    restart: unless-stopped
    command: celery -A config.celery_app worker -l INFO --concurrency=1 --max-tasks-per-child=50
    mem_limit: 2560m
    pids_limit: 512
    stop_grace_period: 2m
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celerybeat:
    <<: *django
    restart: unless-stopped
    command: /start-celerybeat
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: docker.io/nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    ports:
      - 127.0.0.1:8000:8080
    volumes:
      - ./compose/oracle/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - production_media:/media:ro
    mem_limit: 128m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run rentium-api
    depends_on:
      nginx:
        condition: service_healthy
    volumes:
      - /etc/cloudflared:/etc/cloudflared:ro,Z
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  production_postgres_data:
  production_postgres_backups:
  production_redis_data:
  production_media:
